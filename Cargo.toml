[workspace]
resolver = "3"
members = ["cli", "crates/command", "crates/core", "crates/model", "crates/platform", "crates/transports/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/opendap-project/host"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
opendap-host-model = { path = "crates/model" }
opendap-host-command = { path = "crates/command" }
opendap-host-core = { path = "crates/core" }
opendap-host-platform = { path = "crates/platform" }
opendap-host-transports-ssh = { path = "crates/transports/ssh" }
opendap-host-transports-emulator = { path = "crates/transports/emulator" }
